<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LwRC+ 2026</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1c1a;--mute:#6b6b66;--line:#e4e3de;--acc:#2f5bd3;--pos:#1f7a4d;--neg:#b3392f;--chip:#efeee9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--panel:#1d1d1b;--ink:#ecebe6;--mute:#9a9992;--line:#30302c;--acc:#7c9cff;--pos:#5cc48d;--neg:#ef7d72;--chip:#272724}}
:root[data-theme="dark"]{--bg:#151514;--panel:#1d1d1b;--ink:#ecebe6;--mute:#9a9992;--line:#30302c;--acc:#7c9cff;--pos:#5cc48d;--neg:#ef7d72;--chip:#272724}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
header h1{margin:0;font-size:22px;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 12px}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mute);padding:6px 10px;border-radius:6px;font:inherit;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
input[type=search],select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{flex:1 1 200px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--panel);color:var(--mute);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
th.sorted{color:var(--ink)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--chip)}
td.ix{font-weight:700}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--mute)}
tr.detail td{background:var(--bg);text-align:left;white-space:normal;cursor:default}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 18px;padding:4px 0}
.dl div span{display:block;color:var(--mute);font-size:12px}
.dl div span.help{display:inline-flex;font-size:9px}
.form b{display:inline-block;width:16px;text-align:center;font-size:11px;border-radius:3px;margin-right:2px;color:#fff}
.form .W{background:var(--pos)}.form .L{background:var(--neg)}
.meta{color:var(--mute);font-size:12px;margin-top:12px}
.meta ul{margin:6px 0 0;padding-left:18px}
.count{color:var(--mute);font-size:12px;margin-left:auto}
.help{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:4px;border-radius:50%;border:1px solid var(--mute);color:var(--mute);font-size:9px;font-weight:700;line-height:1;cursor:help;vertical-align:1px}
.help:hover,.help:focus{border-color:var(--acc);color:var(--acc);outline:none}
#tip{position:fixed;z-index:10;max-width:320px;padding:9px 11px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;white-space:pre-line;text-align:left;font-weight:400;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:none}
#theme{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<header style="display:flex;gap:12px;align-items:flex-start">
  <div style="flex:1">
    <h1>LwRC+ 2026</h1>
    <p>선수 퍼포먼스 참고 지표 — 선택한 대회 범위 안에서 같은 포지션 평균을 100으로 계산. 승리 기여 지표가 아니다.</p>
  </div>
  <button id="theme" title="테마 전환">◐</button>
</header>

<div class="bar">
  <div class="seg" id="metric"><button data-m="lwrc" class="on">LwRC+</button><button data-m="gold">실제 골드</button></div>
  <div class="seg" id="view"><button data-v="players" class="on">선수</button><button data-v="teams">팀</button></div>
  <div class="seg" id="scope"></div>
</div>
<div class="bar">
  <input type="search" id="q" placeholder="선수·팀 검색 (예: Faker, GEN)">
  <select id="role"><option value="">전 포지션</option><option>TOP</option><option>JG</option><option>MID</option><option>BOT</option><option>SUP</option></select>
  <select id="lg"><option value="">전 리그</option></select>
  <select id="ming"><option value="0">게임 수 0+</option><option value="10" selected>10+</option><option value="25">25+</option></select>
  <span class="count" id="count"></span>
</div>

<div class="card"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
<div class="meta" id="meta"></div>
<div id="tip" role="tooltip" hidden></div>
</div>

<script>
const SCOPES=[["all","전체"],["lck","LCK"],["lck_s1","LCK S1"],["lck_s2","LCK S2"],["lck_s3","LCK S3"],["fs","First Stand"],["msi","MSI"],["worlds","Worlds"]];
const fmt=(v,d=0)=>v==null?"—":Number(v).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=v=>v==null?"":v>0?"pos":v<0?"neg":"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 도움말 문구 — 정의는 docs/contracts/output-web.md, docs/spec/05 기준
const HELP={
  rank:"같은 범위·같은 포지션 안에서 LwRC+ 순위 / 대상 선수 수. 최소 게임 수 이상인 선수만 순위를 매기고, 미달이면 —로 표시한다.",
  team:"이 범위에서 가장 많이 뛴 팀. 리그 표시는 2026 지역 리그 참가 기록(Leaguepedia) 기준.",
  role:"이 범위에서 가장 많이 뛴 포지션.",
  g:"이 범위에서 뛴 게임 수 (경기 수가 아님).",
  ix:"LwRC+ = 100 × 선수 LwRC/분 ÷ 같은 범위·같은 포지션 평균 LwRC/분.\n100이 평균이고, 121이면 평균보다 21% 높다. 음수도 그대로 표시한다.\n선수 퍼포먼스 참고 지표이며, 승리 기여 지표가 아니다.",
  pg:"LwRC +/G = (선수 LwRC/분 − 같은 포지션 평균 LwRC/분) × 플레이 분 ÷ 게임 수.\n평균 선수보다 한 게임에 팀 기대 골드를 몇 골드 더 움직였는지 나타낸다. 실제로 더 번 골드가 아니다.\n골드 단위라서 평균 골드가 큰 포지션(원딜 등)일수록 같은 LwRC+에서도 값이 크다.",
  rate:"분당 LwRC. LwRC = C 생산 + D 차단 + Risk = 선수가 팀 기대 골드(10분 뒤 팀 골드의 학습 예측 G)를 움직인 양.\n범위 안 선수-게임 값을 ±3σ로 자른 뒤 합 ÷ 플레이 분으로 계산한다.",
  share:"팀 내 비중 = max(0, 선수 LwRC) ÷ 같은 팀 선수들의 max(0, LwRC) 합.\n분당 값이 아니라 절대량 기준이라 많이 뛴 선수, 골드가 큰 포지션(원딜)일수록 크게 나온다. 골드 기여 기준이다.",
  tix:"팀 LwRC+ = 소속 선수 LwRC+를 그 팀에서 뛴 분으로 가중 평균한 값. 교체 선수도 뛴 만큼 반영된다.",
  tpg:"팀 LwRC +/G = Σ 소속 선수 (LwRC/분 − 포지션 평균) × 그 팀에서 뛴 분 ÷ 팀 게임 수.\n평균적인 팀보다 한 게임에 팀 기대 골드를 몇 골드 더 움직였는지 나타낸다.",
  series:"경기(match) 승–패. 경기는 BO1·BO3·BO5 단위이고, 한 경기 안에서 게임을 1~5번 치른다.\nraw 기준: raw에 그 경기의 게임이 모두 있는 경기만 센다 (일부만 있는 경기는 아래 안내 참고).",
  games:"게임(game) 승–패. raw에 있는 게임 하나하나의 승패를 합한 값 (게임 수와 같다).",
  wr:"게임 승률 = 게임 승 ÷ (게임 승 + 게임 패).",
  form:"최근 5경기 결과 (게임이 아니라 경기 단위, raw에 게임이 모두 있는 경기만). 왼쪽이 오래된 경기, 오른쪽이 최근 경기.",
  top:"팀 안에서 LwRC+가 가장 높은 포지션.",
  lwrc:"이 범위의 LwRC 합 = C 생산 + D 차단 + Risk. 자르지 않은 원값이다.",
  min:"이 범위에서 뛴 시간(분).",
  c:"C 생산 = 실현 골드 + 가속 C 배분.",
  cgold:"본인이 실제로 번 골드. 교전 안팎 모두 번 사람에게 귀속한다.",
  cpie:"교전 클러스터에서 우리 팀 골드 수입 속도가 빨라진 몫(스노우볼)을, 관여도(딜·어시스트·피해 흡수·교전 존재·시야 제공/차단·CC·보호)에 따라 나눈 값.",
  d:"D 차단 = 교전에서 상대 팀 골드 수입 속도를 떨어뜨린 몫(상대 데스로 생긴 감속 포함)을 관여도에 따라 나눈 값.",
  risk:"본인 데스의 비용: 생존 인원 −1, 부활 대기, 상대에게 넘어간 현상금·셧다운. 항상 음수다.",
  // 실제 골드 — 게임 내 관측값(stats_update totalGold)만 사용, G 모델·배분 없음
  grank:"같은 범위·같은 포지션 안에서 Gold+ 순위 / 대상 선수 수. 최소 게임 수 이상인 선수만.",
  gplus:"Gold+ = 100 × 선수 분당 골드(GPM) ÷ 같은 범위·같은 포지션 평균 GPM.\n골드는 게임 내 totalGold(종료 시점, 시작 골드 포함) 그대로다. 100이 평균.",
  gpg:"실제 골드 +/G = (선수 GPM − 같은 포지션 평균 GPM) × 플레이 분 ÷ 게임 수.\n평균 선수보다 한 게임에 실제로 몇 골드 더 벌었는지.",
  gpm:"분당 골드 = 범위 안 종료 totalGold 합 ÷ 플레이 분 합.",
  gd15:"15분 골드 차 = 15:00 시점 본인 totalGold − 같은 포지션 상대 선수 totalGold의 게임 평균. 15분 전에 끝난 게임은 빠진다.",
  gshare:"골드 비중 = 본인 종료 골드 합 ÷ 같은 게임들의 팀 종료 골드 합.",
  glx:"같은 범위의 LwRC+ (비교용). 게임 내 골드가 아니라 팀 기대 골드를 움직인 양 기준이다.",
  gdiff:"순위 차이 = Gold+ 순위 − LwRC+ 순위 (같은 범위·포지션, 최소 게임 수 이상).\n양수(▲)면 실제로 번 골드 순위보다 LwRC+ 순위가 높다 — 교전 가속·차단(C·D)이나 적은 데스로 더 높게 평가됐다. 음수(▼)면 반대.\n두 지표는 퍼진 폭이 달라(LwRC+ 표준편차 약 10, Gold+ 약 3.7) 값의 차이 대신 순위를 비교한다.",
  tgdiff:"순위 차이 = 팀 Gold+ 순위 − 팀 LwRC+ 순위 (같은 범위). 양수(▲)면 LwRC+에서 더 높은 순위.",
  tgplus:"팀 Gold+ = 100 × 팀 분당 골드 ÷ 같은 범위 전체 팀 평균 분당 골드.",
  tgpg:"팀 실제 골드 +/G = Σ 소속 선수 (GPM − 포지션 평균 GPM) × 그 팀에서 뛴 분 ÷ 팀 게임 수.",
  tgpm:"팀 분당 골드 = 팀 종료 totalGold 합 ÷ 게임 시간 합.",
  tgd15:"15분 팀 골드 차(5명 라인 상대 차의 합) 게임 평균.",
  tgdend:"게임 종료 시 팀 골드 − 상대 팀 골드의 게임 평균.",
  twr:"게임 승률 (raw 게임 기준).",
  tglx:"같은 범위의 팀 LwRC+ (비교용).",
};
const rk=v=>v==null?"—":v===0?"0":`<span class="${sgn(v)}">${v>0?"▲":"▼"}${Math.abs(v)}</span>`;
const plus=(v,d=0)=>v==null?"—":`<span class="${sgn(v)}">${v>0?"+":""}${fmt(v,d)}</span>`;
const IX=v=>`<span class="${sgn(v-100)}">${fmt(v)}</span>`;
const COLS={
  gold_players:[
    {k:"role_rank",h:"#",t:HELP.grank,f:r=>r.role_rank==null?"—":`${r.role_rank}<span class="tag">/${r.role_n}</span>`},
    {k:"name",h:"선수",l:1,f:r=>`<b>${esc(r.name)}</b>`},
    {k:"team",h:"팀",l:1,t:HELP.team,f:r=>`${esc(r.team)} <span class="tag">${esc(r.lg)}</span>`},
    {k:"role",h:"포지션",l:1,t:HELP.role},
    {k:"g",h:"게임",t:HELP.g},
    {k:"gold_plus",h:"Gold+",c:"ix",t:HELP.gplus,f:r=>IX(r.gold_plus)},
    {k:"gold_pg",h:"실제 골드 +/G",t:HELP.gpg,f:r=>plus(r.gold_pg)},
    {k:"gpm",h:"분당 골드",t:HELP.gpm,f:r=>fmt(r.gpm,1)},
    {k:"gd15",h:"15분 골드 차",t:HELP.gd15,f:r=>plus(r.gd15)},
    {k:"gold_share",h:"골드 비중",t:HELP.gshare,f:r=>fmt(r.gold_share,1)+"%"},
    {k:"lwrc_ix",h:"LwRC+",t:HELP.glx,f:r=>`${IX(r.lwrc_ix)}${r.lwrc_rank==null?"":`<span class="tag">${r.lwrc_rank}위</span>`}`},
    {k:"rank_diff",h:"순위 차이",t:HELP.gdiff,f:r=>rk(r.rank_diff)},
  ],
  gold_teams:[
    {k:"team",h:"팀",l:1,f:r=>`<b>${esc(r.team)}</b>`},
    {k:"lg",h:"리그",l:1,t:HELP.team},
    {k:"g",h:"게임",t:HELP.g},
    {k:"gold_plus",h:"팀 Gold+",c:"ix",t:HELP.tgplus,f:r=>IX(r.gold_plus)},
    {k:"gold_pg",h:"실제 골드 +/G",t:HELP.tgpg,f:r=>plus(r.gold_pg)},
    {k:"gpm",h:"팀 분당 골드",t:HELP.tgpm,f:r=>fmt(r.gpm,1)},
    {k:"gd15",h:"15분 골드 차",t:HELP.tgd15,f:r=>plus(r.gd15)},
    {k:"gd_end",h:"종료 골드 차",t:HELP.tgdend,f:r=>plus(r.gd_end)},
    {k:"wr",h:"게임 승률",t:HELP.twr,f:r=>fmt(r.wr*100,1)+"%"},
    {k:"lwrc_ix",h:"팀 LwRC+",t:HELP.tglx,f:r=>`${IX(r.lwrc_ix)}<span class="tag">${r.lwrc_rank}위</span>`},
    {k:"rank_diff",h:"순위 차이",t:HELP.tgdiff,f:r=>rk(r.rank_diff)},
  ],
  lwrc_players:[
    {k:"role_rank",h:"#",t:HELP.rank,f:r=>r.role_rank==null?"—":`${r.role_rank}<span class="tag">/${r.role_n}</span>`},
    {k:"name",h:"선수",l:1,f:r=>`<b>${esc(r.name)}</b>`},
    {k:"team",h:"팀",l:1,t:HELP.team,f:r=>`${esc(r.team)} <span class="tag">${esc(r.lg)}</span>`},
    {k:"role",h:"포지션",l:1,t:HELP.role},
    {k:"g",h:"게임",t:HELP.g},
    {k:"ix",h:"LwRC+",c:"ix",t:HELP.ix,f:r=>`<span class="${sgn(r.ix-100)}">${fmt(r.ix)}</span>`},
    {k:"pg",h:"LwRC +/G",t:HELP.pg,f:r=>`<span class="${sgn(r.pg)}">${r.pg>0?"+":""}${fmt(r.pg)}</span>`},
    {k:"rate",h:"LwRC/분",t:HELP.rate,f:r=>fmt(r.rate,1)},
    {k:"team_share",h:"팀 내 비중",t:HELP.share,f:r=>r.team_share==null?"—":fmt(r.team_share,1)+"%"},
  ],
  lwrc_teams:[
    {k:"team",h:"팀",l:1,f:r=>`<b>${esc(r.team)}</b>`},
    {k:"lg",h:"리그",l:1,t:HELP.team},
    {k:"ix",h:"팀 LwRC+",c:"ix",t:HELP.tix,f:r=>`<span class="${sgn(r.ix-100)}">${fmt(r.ix)}</span>`},
    {k:"pg",h:"LwRC +/G",t:HELP.tpg,f:r=>`<span class="${sgn(r.pg)}">${r.pg>0?"+":""}${fmt(r.pg)}</span>`},
    {k:"W",h:"경기",t:HELP.series,f:r=>`${r.W}–${r.L}`},
    {k:"sw",h:"게임",t:HELP.games,f:r=>`${r.sw}–${r.sl}`},
    {k:"wr",h:"게임 승률",t:HELP.wr,f:r=>r.wr==null?"—":fmt(r.wr*100,1)+"%"},
    {k:"form",h:"최근 5",l:1,t:HELP.form,f:r=>`<span class="form">${[...(r.form||"")].map(c=>`<b class="${c}">${c}</b>`).join("")}</span>`},
    {k:"top_role",h:"최고 포지션",l:1,t:HELP.top},
  ]};
const q=t=>t?`<span class="help" tabindex="0" role="button" aria-label="도움말" data-help="${esc(t)}">?</span>`:"";
const st={metric:"lwrc",view:"players",scope:"all",q:"",role:"",lg:"",ming:10,sort:{lwrc_players:["ix",-1],lwrc_teams:["ix",-1],gold_players:["gold_plus",-1],gold_teams:["gold_plus",-1]},open:null};
const key=()=>`${st.metric}_${st.view}`;
let D={};

function load(){try{const s=JSON.parse(localStorage.getItem("lwrc_ui2")||"{}");Object.assign(st,s,{open:null})}catch(e){}}
function save(){try{const{open,...s}=st;localStorage.setItem("lwrc_ui2",JSON.stringify(s))}catch(e){}}

function rows(){
  const src=st.metric==="gold"?D.gold[st.view]:st.view==="players"?D.players.players:D.teams.teams, q=st.q.trim().toLowerCase();
  let r=src.filter(x=>x.scope===st.scope&&(x.g??0)>=st.ming&&(!st.lg||x.lg===st.lg));
  if(st.view==="players"&&st.role)r=r.filter(x=>x.role===st.role);
  if(q)r=r.filter(x=>(x.name||"").toLowerCase().includes(q)||(x.team||"").toLowerCase().includes(q));
  const[k,dir]=st.sort[key()];
  return r.sort((a,b)=>{const x=a[k],y=b[k];if(x==null)return 1;if(y==null)return -1;return(typeof x==="string"?x.localeCompare(y):x-y)*dir});
}
function detail(r){
  if(st.metric==="gold"){
    if(st.view==="players")return `<div class="dl"><div><span>종료 골드 합</span>${fmt(r.gold)}</div><div><span>플레이 분${q(HELP.min)}</span>${fmt(r.minutes,1)}</div>
      <div><span>15분 골드 차 표본</span>${r.g15}게임</div><div><span>Gold+ → LwRC+</span>${fmt(r.gold_plus)} → ${fmt(r.lwrc_ix)}</div></div>`;
    const p=D.gold.players.filter(x=>x.scope===st.scope&&x.team===r.team).sort((a,b)=>b.minutes-a.minutes);
    return `<div class="dl">${p.map(x=>`<div><span>${esc(x.role)} · ${x.g}게임</span><b>${esc(x.name)}</b> Gold+ ${fmt(x.gold_plus)} · LwRC+ ${fmt(x.lwrc_ix)}</div>`).join("")}</div>`;
  }
  if(st.view==="players")return `<div class="dl">
    <div><span>LwRC (합)${q(HELP.lwrc)}</span>${fmt(r.lwrc)}</div><div><span>플레이 분${q(HELP.min)}</span>${fmt(r.minutes,1)}</div>
    <div><span>C 생산${q(HELP.c)}</span>${fmt(r.c)}</div><div><span>　실현 골드${q(HELP.cgold)}</span>${fmt(r.c_gold)}</div><div><span>　가속 C 배분${q(HELP.cpie)}</span>${fmt(r.c_pie)}</div>
    <div><span>D 차단${q(HELP.d)}</span>${fmt(r.d)}</div><div><span>Risk 데스${q(HELP.risk)}</span><b class="neg">${fmt(r.risk)}</b></div>
    <div><span>팀 내 비중${q(HELP.share)}</span>${r.team_share==null?"—":fmt(r.team_share,1)+"% (골드 기여 기준)"}</div></div>`;
  const p=D.players.players.filter(x=>x.scope===st.scope&&x.team===r.team).sort((a,b)=>b.minutes-a.minutes);
  return `<div class="dl">${p.map(x=>`<div><span>${esc(x.role)} · ${x.g}게임</span><b>${esc(x.name)}</b> ${fmt(x.ix)}</div>`).join("")}</div>`;
}
function render(){
  document.querySelectorAll("#metric button").forEach(b=>b.classList.toggle("on",b.dataset.m===st.metric));
  document.querySelectorAll("#view button").forEach(b=>b.classList.toggle("on",b.dataset.v===st.view));
  document.querySelectorAll("#scope button").forEach(b=>b.classList.toggle("on",b.dataset.s===st.scope));
  document.getElementById("role").style.display=st.view==="players"?"":"none";
  const cols=COLS[key()],[sk,sd]=st.sort[key()];
  document.getElementById("th").innerHTML="<tr>"+cols.map(c=>`<th data-k="${c.k}" class="${c.l?"l":""} ${c.k===sk?"sorted":""}">${c.h}${q(c.t)}${c.k===sk?(sd<0?" ▾":" ▴"):""}</th>`).join("")+"</tr>";
  const r=rows();
  document.getElementById("tb").innerHTML=r.map((x,i)=>{
    const id=st.view==="players"?x.player_id:x.team, row=`<tr data-id="${esc(id)}">`+cols.map(c=>`<td class="${c.l?"l":""} ${c.c||""}">${c.f?c.f(x):esc(x[c.k])}</td>`).join("")+"</tr>";
    return st.open===id?row+`<tr class="detail"><td colspan="${cols.length}">${detail(x)}</td></tr>`:row;
  }).join("")||`<tr><td colspan="${cols.length}" class="l" style="color:var(--mute)">조건에 맞는 결과가 없습니다.</td></tr>`;
  document.getElementById("count").textContent=`${r.length}${st.view==="players"?"명":"팀"}`;
  save();
}
function init(){
  load();
  document.getElementById("scope").innerHTML=SCOPES.map(([s,n])=>`<button data-s="${s}">${n}</button>`).join("");
  const lgs=[...new Set(D.players.players.map(x=>x.lg).filter(Boolean))].sort();
  document.getElementById("lg").innerHTML+=lgs.map(l=>`<option>${l}</option>`).join("");
  for(const[id,key,num]of[["q","q"],["role","role"],["lg","lg"],["ming","ming",1]]){
    const el=document.getElementById(id);el.value=st[key];
    el.addEventListener("input",()=>{st[key]=num?+el.value:el.value;st.open=null;render()});
  }
  document.getElementById("metric").onclick=e=>{if(e.target.dataset.m){st.metric=e.target.dataset.m;st.open=null;render()}};
  document.getElementById("view").onclick=e=>{if(e.target.dataset.v){st.view=e.target.dataset.v;st.open=null;render()}};
  document.getElementById("scope").onclick=e=>{if(e.target.dataset.s){st.scope=e.target.dataset.s;st.open=null;render()}};
  // 도움말: 마우스 오버·키보드 포커스로 표시, 터치는 탭으로 토글. 정렬·행 펼침으로 번지지 않게 막는다.
  const tip=document.getElementById("tip");
  const show=el=>{tip.textContent=el.dataset.help;tip.hidden=false;const b=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=Math.max(8,Math.min(innerWidth-w-8,b.left+b.width/2-w/2))+"px";
    tip.style.top=(b.bottom+8+h>innerHeight?b.top-h-8:b.bottom+8)+"px";tip._el=el};
  const hide=()=>{tip.hidden=true;tip._el=null};
  document.addEventListener("mouseover",e=>{const el=e.target.closest(".help");if(el)show(el)});
  document.addEventListener("mouseout",e=>{if(e.target.closest(".help"))hide()});
  document.addEventListener("focusin",e=>{const el=e.target.closest(".help");if(el)show(el)});
  document.addEventListener("focusout",e=>{if(e.target.closest(".help"))hide()});
  document.addEventListener("click",e=>{const el=e.target.closest(".help");if(el){e.stopPropagation();tip._el===el&&!tip.hidden?hide():show(el)}else hide()},true);
  addEventListener("scroll",hide,true);
  document.getElementById("th").onclick=e=>{const k=e.target.closest("th")?.dataset.k;if(!k)return;const s=st.sort[key()];st.sort[key()]=s[0]===k?[k,-s[1]]:[k,typeof rows()[0]?.[k]==="string"?1:-1];render()};
  document.getElementById("tb").onclick=e=>{const tr=e.target.closest("tr[data-id]");if(!tr)return;st.open=st.open===tr.dataset.id?null:tr.dataset.id;render()};
  document.getElementById("theme").onclick=()=>{const h=document.documentElement,dark=h.dataset.theme?h.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;h.dataset.theme=dark?"light":"dark"};
  const m=D.meta,g=m.games_by_tournament;
  document.getElementById("meta").innerHTML=`데이터: ${Object.entries(g).map(([t,n])=>`${t} ${n}`).join(" · ")} (총 ${Object.values(g).reduce((a,b)=>a+b,0)}게임)
    · 가중 ${esc(D.players.allocation_method)} · ${esc(D.players.version)} · 생성 ${esc(D.players.generated_at.slice(0,10))}
    <ul>${m.notes.map(n=>`<li>${esc(n)}</li>`).join("")}<li>순위(#)는 ${m.min_games_for_ranking}게임 이상 선수만. 행을 누르면 C·D·Risk 성분을 볼 수 있다.</li><li>실제 골드 탭은 게임 내 totalGold 관측값만으로 계산했다 (G 모델·배분 없음). LwRC+와 같은 게임·범위·포지션 기준이라 나란히 비교할 수 있다.</li></ul>`;
  render();
}
Promise.all(["players","teams","meta","gold"].map(n=>fetch(`data/${n}.json`).then(r=>r.json()))).then(([p,t,m,g])=>{D={players:p,teams:t,meta:m,gold:g};init()})
  .catch(e=>{document.getElementById("tb").innerHTML=`<tr><td class="l">데이터를 불러오지 못했습니다: ${esc(e.message)}</td></tr>`});
</script>
</body>
</html>
