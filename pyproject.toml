[project]
name = "lwrc-local"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "jupyterlab>=4.6.4",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/common",
    "src/ingest",
    "src/normalize",
    "src/features",
    "src/metrics",
    "src/report",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
