# LwRC+ v1.0 (개정) — 모든 상수. 코드에 상수를 하드코딩하지 말 것.

g:
  label_horizon_min: 10          # 레이블 = 10분 뒤 팀 골드
  censor_rate_window_min: 3      # 종료 외삽용 직전 수입 속도 구간
  train_sample_sec: 30           # 학습 샘플링 간격 (산출은 1Hz)
  model: linear_ridge
  crossfit_k: 5                  # 경기 단위
  holdout_tail_fraction: 0.25    # 시간 홀드아웃 검증용
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]   # 경기 단위 내부 CV로 선택
  sign_rules:                    # spec/07 검증 1 — 우리 관점 피처의 기대 부호. 어긋나면 모델 반려
    gold_us: +1
    alive_us: +1
    respawn_sum_us: -1
    dragon_stack_us: +1
    baron_buff_us: +1
    tower_outer_taken: +1
    tower_inner_taken: +1        # 억제기 타워(tower_base_taken)는 규칙에서 뺌 — 결정 23
  price_examples:                # 단가표의 데스 예시 부활 대기(초)
    death_respawn_sec: [15, 30, 50]

prior_g:                         # 비교 기준선 전용
  w_alive: 0.30
  w_dragon: 0.05
  w_tower: 0.03
  w_baron: 0.10

cluster:
  window_sec: 10
  merge_sec: 10
  # window_gap = 인접 창 사이 간격 ≤ merge_sec (씨앗 간격 ≤ 2·window + merge). 결정 25
  merge_rule: window_gap
  # 결정적 감쇠 (결정 28): 사건 없이 시간만으로 일어나는 상태 변화. 클러스터 잔여에서 빼서 시간항과 함께 팀 계정으로.
  # decreasing = 틱 간 감소분만 (부활 대기·버프 잔여), increasing = 틱 간 증가분만 (부활로 생존 +1)
  decay_features:
    decreasing: [respawn_sum_us, respawn_sum_opp, baron_buff_us, baron_buff_opp, elder_buff_us, elder_buff_opp]
    increasing: [alive_us, alive_opp]
  warn_len_sec: 180
  # 몬스터 이름은 원본 epic_monster_kill.monsterType 표기 그대로 (대소문자 구분).
  # 공허 유충 = VoidGrub (2026-10-31 확정, 'horde' 명칭 쓰지 않음). atakhan은 원본 표기 미확인.
  # 아래 두 목록에 없는 monsterType이 원본에 나오면 L1 적재가 오류로 멈춘다 (조용히 누락 방지).
  seed_monsters: [dragon, baron, riftHerald, VoidGrub, atakhan]
  jungle_camps: [raptor, wolf, krug, gromp, redCamp, blueCamp, scuttleCrab]

buffs:
  baron_sec: 180
  elder_sec: 150

allocation:
  method: both                   # both = prior와 regression 모두 산출, 신뢰도로 정본 채택
  prior_weights: {dmg: 1.0, assist: 0.5, absorb: 0.3, presence: 0.2, vision_provided: 0.0, vision_denied: 0.0, cc: 0.0, protect: 0.0}
  dmg_source: frame_delta        # 프레임 누적 챔피언 피해 증가분
  estimator: nnls_ridge
  ridge_alphas: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]   # 표준화 피처 기준, 경기 단위 내부 CV로 선택
  bootstrap_reps: 200            # 경기 단위 재표집 (β 신뢰구간)
  # 회귀 목표 Swing = 잔여_us − 잔여_opp (속도형·감쇠 제외 잔여, 결정 27·28). 통제항: 직전 G 차이·시각·길이·참가 인원
  position_specific_beta: false
  presence_radius: 2300
  vision_radius: 3300
  vision_pre_window_sec: 30
  vision_ward_types: [sight, yellowTrinket, blueTrinket, control]   # unknown 제외 (결정 16)
  ward_rules:                     # 와드 만료 추정 (결정 17, 근거 specs/ward_duration_2026-10-31.md). 패치 16.15 기준
    patch: "16.15"
    duration_sec:                 # null = 제거될 때까지
      yellowTrinket: {min: 90, max: 120, scale: avg_champion_level}   # 90 + 30·(평균 레벨 − 1)/17
      sight: 150
      blueTrinket: null
      control: null
    limit_group: {yellowTrinket: stealth, sight: stealth, control: control}   # blueTrinket 제한 없음
    limit: {stealth: 3, control: 1}   # 초과 설치 시 같은 그룹의 가장 오래된 와드가 사라짐 (이벤트 없음)
    match_xz: 50                  # 설치↔제거 매칭 위치 허용 오차 (연결 키 없음, spec/06 §2)
  cc_stat: TOTAL_TIME_CROWD_CONTROL_DEALT_TO_CHAMPIONS                    # 결정 19
  protect_stats: [TOTAL_DAMAGE_SHIELDED_ON_TEAMMATES, TOTAL_HEAL_ON_TEAMMATES]
  shrinkage_k: 0                 # prior 수축 없음 — 표본 충분(클러스터 약 8,900), prior는 기준선으로 따로 산출 (결정 29)

season:
  year: 2026
  events: [LCK, FirstStand, MSI, Worlds]
  output_scopes: [all, lck, lck_s1, lck_s2, lck_s3, fs, msi, worlds]
  scope_tournaments:             # scope → 포함 대회 폴더 (결정 20). all = 아래 전부
    lck_s1: [LCK_Cup]
    lck_s2: [LCK_R1-2, Road_to_MSI]
    lck_s3: [LCK_R3-4, LCK_PlayIn_PO]
    lck: [LCK_Cup, LCK_R1-2, Road_to_MSI, LCK_R3-4, LCK_PlayIn_PO]
    fs: [FirstStand]
    msi: [MSI]
    worlds: [Worlds]
  min_games_for_ranking: 10
  winsorize_sigma: 3
  length_corr_threshold: 0.2
  length_buckets_min: [25, 35]   # 층화 시: ≤25 / 25~35 / 35+

stage_map:                       # match → tournament/stage (결정 18). 출처 Leaguepedia, 조인 키 platform_game_id = RiotPlatformGameId
  exclude_overview_contains: ["Classic Showmatch"]
  rules:                         # 위에서부터 첫 일치. tab_prefix 생략 = 해당 페이지 전체. stage: by_group = TournamentGroups의 팀 그룹
    - {overview: "LCK/2026 Season/Cup", tab_prefix: "Week", tournament: LCK_Cup, stage: Group}
    - {overview: "LCK/2026 Season/Cup", tab_prefix: "Play-In", tournament: LCK_Cup, stage: PlayIn}
    - {overview: "LCK/2026 Season/Cup", tournament: LCK_Cup, stage: Playoffs}
    - {overview: "2026 First Stand", tab_prefix: "Groups", tournament: FirstStand, stage: Group}
    - {overview: "2026 First Stand", tournament: FirstStand, stage: Knockout}
    - {overview: "LCK/2026 Season/Rounds 1-2", tournament: LCK_R1-2, stage: Regular}
    - {overview: "LCK/2026 Season/Road to MSI", tournament: Road_to_MSI, stage: Qualifier}
    - {overview: "2026 Mid-Season Invitational", tab_prefix: "Play-In", tournament: MSI, stage: PlayIn}
    - {overview: "2026 Mid-Season Invitational", tournament: MSI, stage: Bracket}
    - {overview: "LCK/2026 Season/Rounds 3-4", tournament: LCK_R3-4, stage: by_group}
    - {overview: "LCK/2026 Season/Season Play-In", tournament: LCK_PlayIn_PO, stage: PlayIn}
    - {overview: "LCK/2026 Season/Season Playoffs", tournament: LCK_PlayIn_PO, stage: Playoffs}
    - {overview: "2026 Season World Championship/Play-In", tournament: Worlds, stage: PlayIn}
    - {overview: "2026 Season World Championship/Main Event", tab_prefix: "Round", tournament: Worlds, stage: Swiss}
    - {overview: "2026 Season World Championship/Main Event", tournament: Worlds, stage: Knockout}
  group_stage: {"Legend Group": Legend, "Rise Group": Rise}
  source_labels:                 # 교차 확인: Kazel games.csv의 tournament 라벨. 어긋나면 적재 중단
    LCK_Cup: lck_split_1_2026
    FirstStand: first_stand_2026
    LCK_R1-2: lck_split_2_2026
    Road_to_MSI: lck_split_2_2026
    MSI: msi_2026
    LCK_R3-4: lck_split_3_2026
    LCK_PlayIn_PO: lck_split_3_2026
    Worlds: worlds_2026

identity:
  epsilon: 1.0
